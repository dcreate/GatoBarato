<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Gato Barato | ¿Qué necesitas?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <main class="contenedor">
        <header class="encabezado">
            <!-- Puedes cambiar logo.png por la ubicación de tu logo -->
            <img src="img/gatobarato.png" alt="Gato Barato" class="logo">
            <h1>Gato Barato</h1>
            <p class="eslogan">
                Soluciones rápidas sin arañar tu bolsillo
            </p>
            <p class="pregunta">
                ¿Qué necesitas?
            </p>
        </header>

        <section class="servicios">
            <button class="servicio" data-servicio="mantenimiento">
                <span class="icono">💻</span>
                <span>
                    <strong>Mantenimiento de computadora</strong>
                    <small>Limpieza, reparación y optimización</small>
                </span>
            </button>

            <button class="servicio" data-servicio="camaras">
                <span class="icono">📷</span>
                <span>
                    <strong>Instalación de cámaras</strong>
                    <small>Seguridad para casa o negocio</small>
                </span>
            </button>

            <button class="servicio" data-servicio="etiquetas">
                <span class="icono">🏷️</span>
                <span>
                    <strong>Etiquetas y stickers</strong>
                    <small>Diseño, impresión y corte</small>
                </span>
            </button>

            <button class="servicio" data-servicio="impresiones">
                <span class="icono">🖨️</span>
                <span>
                    <strong>Impresiones</strong>
                    <small>Pregunta por nuestros servicios</small>
                </span>
            </button>

            <button class="servicio" data-servicio="recuperacion">
                <span class="icono">💾</span>
                <span>
                    <strong>Recuperación de información</strong>
                    <small>Discos duros y dispositivos</small>
                </span>
            </button>

            <button class="servicio" data-servicio="programas">
                <span class="icono">⚙️</span>
                <span>
                    <strong>Programas y sistemas</strong>
                    <small>Instalación y configuración</small>
                </span>
            </button>
        </section>

        <div class="separador">
            <span>O</span>
        </div>


        <button id="whatsappGeneral" class="whatsapp">
            <span>💬</span>
            Hablar directamente por WhatsApp
        </button>

        <footer>
            <p>📞 785 830 6688</p>
            <p>📱 220 150 1330</p>
            <small>
                Gato Barato © 2026
            </small>
        </footer>
    </main>

    <!-- Ventana para elegir WhatsApp -->
    <div id="modal" class="modal">
        <div class="modal-contenido">
            <button id="cerrar" class="cerrar">×</button>
            <h2>¿A qué número quieres enviar?</h2>
            <p id="mensajeSeleccionado"></p>
            <button id="numero1" class="numero">
                📱 785 830 6688
            </button>

            <button id="numero2" class="numero">
                📱 220 150 1330
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
